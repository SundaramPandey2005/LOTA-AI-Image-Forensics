name: lota_mp
seed: 1
data:
  root: /kaggle/input/datasets/yangsangtai/tiny-genimage
  train_generator: sdv5
  val_fraction: 0.1
  max_train_per_class: null
  max_test_per_class: null
  num_workers: 4
forensic:
  bit_mode: scaling
  num_bits: 3
  patch_size: 32
  num_candidates: 64
  selection: max
  image_size: 256
  resize_before_bits: false
model:
  backbone: resnet50
  pretrained: true
  num_patches: 4
  aggregation: logit_mean
train:
  epochs: 10
  batch_size: 32
  lr: 0.0001
  lr_power: 0.9
  instance_loss_weight: 0.0
  amp: true
eval:
  max_patches: 8
  k_values:
  - 1
  - 2
  - 4
  - 8
  batch_size: 32
